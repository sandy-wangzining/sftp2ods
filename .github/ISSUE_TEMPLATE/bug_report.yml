name: Bug 报告
description: 运行结果和预期不一致（报错、少数据、卡住……）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认：说明用的是哪个作业（可脱敏）、跑的命令、完整报错。
        **不要贴真实密钥**（SFTP 密码、阿里云 AK/SK、飞书 webhook）。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 原来的预期 vs 实际结果；有"数据写少了/写多了"请写清具体差多少
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令行、作业配置里相关的几段（密钥用 <占位符>）、源文件长什么样（列头即可）
      placeholder: |
        1. sftp2ods --job jobs/xxx.json --bizdate 20260920 --dry-run
        2. 报错：...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统 + Python 版本 + sftp2ods 版本（sftp2ods --version）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 关键日志
      description: "--log-file 的输出或终端日志（密钥先脱敏）"
